<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReelReview — Film Reviews</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

 
        <div class="form-group">
          <label for="reviewRating">Rating</label>
          <select id="reviewRating" required>
            <option value="">Choose a rating</option>
            <option value="5">★★★★★ — 5/5</option>
            <option value="4">★★★★☆ — 4/5</option>
            <option value="3">★★★☆☆ — 3/5</option>
            <option value="2">★★☆☆☆ — 2/5</option>
            <option value="1">★☆☆☆☆ — 1/5</option>
          </select>
        </div>

        <div class="form-group">
          <label for="reviewText">Your Review</label>
          <textarea
            id="reviewText"
            rows="6"
            placeholder="What did you think of the film? the film is very good and has a lot of meaning to it with  "
            required
          ></textarea>
        </div>

        <button type="submit" class="submit-btn">
          Publish Review
        </button>

        <p id="formMessage"></p>

      </form>

    </section>

  </main>


  <footer>
    <div class="logo">🎬 Reel<span>Review</span></div>
    <p>© 2026 ReelReview. Made for film lovers.</p>
  </footer>


  <!-- Review Modal -->
  <div class="modal" id="reviewModal">

    <div class="modal-content">

      <button class="close-btn" id="closeModal">&times;</button>

      <p class="small-title">would recommend</p>
      <h2 id="modalTitle">A PACKAGE APOCALYPSE</h2>

      <div class="modal-rating">★★★★★</div>

      <p id="modalText">
        Review text will appear here.
      </p>

      <button class="hero-btn" id="modalCloseButton">
        Close
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
